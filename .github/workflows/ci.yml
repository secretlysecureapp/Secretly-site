name: CI

# Build + prerender smoke test on every push/PR.
# On push to main, also deploy to Cloudflare (requires the two repo
# secrets below — Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with "Edit Cloudflare Workers" perms
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-deploy:
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (prerender + sitemap)
        run: npm run build

      - name: Smoke test
        run: npm run test:smoke

      # Сайт выкладывает интеграция Cloudflare с GitHub (Workers Builds) —
      # сама, по отправке в main. Этот шаг — запасной путь и выполняется,
      # только если в репозитории заведён CLOUDFLARE_API_TOKEN. Без секрета он
      # падал на каждой отправке и слал письма «CI failed» при живом сайте.
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Без явной версии действие пыталось запустить wrangler через npx без
          # согласия на установку, падало на «npx canceled … no YES option» и
          # откатывалось на старый встроенный wrangler, который не понимает
          # конфиг только со статикой («Missing entry-point»). Так падала каждая
          # отправка с 24.09.
          wranglerVersion: "4.139.0"
          command: deploy
